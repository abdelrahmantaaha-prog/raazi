<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corpus Inbox</title>
<style>
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: #fbfaf7; color: #1c1a17; margin: 0; width: 22rem; }
  main { padding: .9rem 1rem 1rem; }
  h1 { font: 600 1.05rem/1.3 Georgia, serif; margin: 0 0 .25rem; }
  .muted { color: #6b665e; font-size: .8rem; }
  .title { font-weight: 600; margin: .6rem 0 .1rem; line-height: 1.3; }
  .verdict { margin: .6rem 0; padding: .45rem .6rem; border-radius: 6px; font-size: .82rem; }
  .ok { background: #e6f4ee; color: #1e4d3c; border: 1px solid #b8dcc9; }
  .warn { background: #fdf3e0; color: #6b4a12; border: 1px solid #f0d8a8; }
  .err { background: #fbe7e7; color: #7a2323; border: 1px solid #efbcbc; }
  .row { display: flex; gap: .5rem; align-items: center; margin-top: .6rem; }
  button { font: inherit; border: 0; border-radius: 999px; padding: .45rem .9rem; cursor: pointer; }
  button.primary { background: #7a4b2a; color: #fff; }
  button.primary:disabled { opacity: .35; cursor: default; }
  button.ghost { background: transparent; color: #6b665e; }
  a { color: #7a4b2a; }
  img.pic { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; margin-top: .5rem; display: none; }
</style>
</head>
<body>
<main>
  <h1>Corpus Inbox</h1>
  <div class="muted" id="status">Reading the page…</div>
  <img class="pic" id="pic" alt="">
  <div class="title" id="title"></div>
  <div class="muted" id="meta"></div>
  <div class="verdict" id="verdict" hidden></div>
  <div class="row">
    <button class="primary" id="send" disabled>Send to inbox</button>
    <button class="ghost" id="options">Options</button>
    <a id="open" href="#" target="_blank" hidden>Open the inbox</a>
  </div>
</main>
<script src="popup.js"></script>
</body>
</html>
